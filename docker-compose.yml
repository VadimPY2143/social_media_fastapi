version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: social_media_db
    restart: always
    environment:
      MYSQL_DATABASE: Social_media
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: social_media_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MYSQL=mysql+pymysql://root:@db:3306/Social_media
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
